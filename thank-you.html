<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You — Ms. Louie Lumbao</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #1B2430;
            --ink-soft: #4A5568;
            --paper: #F6F5F1;
            --teal: #2F6F62;
            --teal-deep: #1E4A41;
            --gold: #B8912B;
            --line: #DAD7CD;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--paper);
            color: var(--ink);
            font-family: 'Inter', sans-serif;
            font-size: 16px;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 32px;
        }
        .container {
            max-width: 580px;
        }
        .eyebrow {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 12px;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: var(--teal-deep);
            margin-bottom: 18px;
        }
        h1 {
            font-family: 'Fraunces', serif;
            font-weight: 500;
            font-size: 42px;
            margin-bottom: 16px;
            line-height: 1.1;
        }
        h1 em {
            font-style: italic;
            color: var(--teal);
        }
        p {
            color: var(--ink-soft);
            font-size: 18px;
            margin-bottom: 32px;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            padding: 14px 28px;
            background: var(--ink);
            color: var(--paper);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 0.02em;
            transition: background .2s ease;
        }
        .btn:hover {
            background: var(--teal-deep);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="eyebrow">Message Sent</div>
        <h1>Thank you for reaching <em>out!</em></h1>
        <p>Your message has been delivered. I’ll review your note and get back to you shortly.</p>
        <a href="/" class="btn">← Return to Homepage</a>
    </div>
</body>
</html>
