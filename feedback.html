<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leave a Review — Ms. Louie Lumbao</title>
<script src="https://www.google.com/recaptcha/api.js?render=6LcG6Y4tAAAAAKR-pib-F8e3Jsjx5WaXcIyGfzbr"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1B2430;
    --ink-soft:#4A5568;
    --paper:#F6F5F1;
    --paper-raised:#FFFFFF;
    --teal:#2F6F62;
    --teal-deep:#1E4A41;
    --gold:#B8912B;
    --line:#DAD7CD;
    --radius:2px;
  }

  *{margin:0;padding:0;box-sizing:border-box;}

  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    font-size:16px;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }

  a{color:inherit;}

  header.nav{
    background:rgba(246,245,241,0.92);
    backdrop-filter:blur(6px);
    border-bottom:1px solid var(--line);
  }
  .nav-inner{
    max-width:640px;
    margin:0 auto;
    padding:18px 32px;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .mark{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:20px;
    letter-spacing:0.02em;
  }
  .mark span{color:var(--teal);}
  .nav-inner a.back{
    font-size:13px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    text-decoration:none;
    color:var(--ink-soft);
    border-bottom:1px solid transparent;
    padding-bottom:2px;
    transition:color .2s ease, border-color .2s ease;
  }
  .nav-inner a.back:hover{
    color:var(--teal-deep);
    border-color:var(--teal);
  }

  main{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:64px 24px;
  }

  .form-wrap{
    width:100%;
    max-width:520px;
  }

  .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    letter-spacing:0.16em;
    text-transform:uppercase;
    color:var(--teal-deep);
    margin-bottom:16px;
    display:flex;
    align-items:center;
    gap:10px;
  }
  .eyebrow::before{
    content:"";
    width:26px;
    height:1px;
    background:var(--gold);
    display:inline-block;
  }

  h1{
    font-family:'Fraunces',serif;
    font-weight:500;
    font-size:clamp(28px, 4vw, 38px);
    line-height:1.1;
    margin-bottom:14px;
  }
  h1 em{font-style:italic;color:var(--teal);}

  .form-sub{
    color:var(--ink-soft);
    max-width:48ch;
    margin-bottom:36px;
  }

  form{
    background:var(--paper-raised);
    border:1px solid var(--line);
    padding:32px;
    display:flex;
    flex-direction:column;
    gap:20px;
  }

  label{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin-bottom:8px;
    display:block;
  }

  input[type="text"],
  textarea{
    width:100%;
    font-family:'Inter',sans-serif;
    font-size:15px;
    color:var(--ink);
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:12px 14px;
    transition:border-color .2s ease;
  }
  input[type="text"]:focus,
  textarea:focus{
    outline:none;
    border-color:var(--teal);
  }
  textarea{
    resize:vertical;
    min-height:120px;
  }

  /* Photo option selector */
  .photo-options{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .photo-option{
    display:flex;
    align-items:flex-start;
    gap:10px;
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:12px 14px;
    cursor:pointer;
    transition:border-color .2s ease, background .2s ease;
  }
  .photo-option:hover{border-color:var(--teal);}
  .photo-option input[type="radio"]{
    margin-top:3px;
    accent-color:var(--teal);
  }
  .photo-option .opt-text{
    display:flex;
    flex-direction:column;
    gap:2px;
  }
  .photo-option .opt-title{
    font-size:14px;
    font-weight:600;
    color:var(--ink);
  }
  .photo-option .opt-desc{
    font-size:12.5px;
    color:var(--ink-soft);
  }
  .photo-option.selected{
    border-color:var(--teal);
    background:rgba(47,111,98,0.05);
  }

  .photo-field{
    display:none;
    margin-top:8px;
  }
  .photo-field.active{display:block;}

  #upload-preview{
    margin-top:10px;
    width:56px;
    height:56px;
    border-radius:50%;
    object-fit:cover;
    border:1px solid var(--line);
    display:none;
  }

  button{
    align-self:flex-start;
    display:inline-flex;
    align-items:center;
    gap:10px;
    padding:14px 26px;
    background:var(--ink);
    color:var(--paper);
    border:none;
    border-radius:var(--radius);
    font-family:'Inter',sans-serif;
    font-size:14px;
    letter-spacing:0.02em;
    font-weight:500;
    cursor:pointer;
    transition:background .2s ease;
  }
  button:hover{background:var(--teal-deep);}
  button:disabled{
    background:var(--line);
    color:var(--ink-soft);
    cursor:not-allowed;
  }

  #status{
    margin-top:18px;
    font-size:14px;
    color:var(--ink-soft);
  }
  #status.error{color:#B3261E;}
</style>
</head>
<body>

<header class="nav">
  <div class="nav-inner">
    <div class="mark">Ms. Louie <span>Lumbao</span></div>
    <a href="index.html" class="back">← Back to site</a>
  </div>
</header>

<main>
  <div class="form-wrap">
    <div class="eyebrow">Client Feedback</div>
    <h1>Leave me a <em>review.</em></h1>
    <p class="form-sub">Working together on something? I'd love to hear how it went. Your review helps future clients know what to expect.</p>

    <form id="feedback-form">
      <div>
        <label for="name">Your Name</label>
        <input type="text" id="name" placeholder="e.g. Jane Cruz" required>
      </div>

      <div>
        <label>Your Photo (optional)</label>
        <div class="photo-options">
          <label class="photo-option selected" data-option="initials">
            <input type="radio" name="photo-type" value="initials" checked>
            <span class="opt-text">
              <span class="opt-title">Use my initials</span>
              <span class="opt-desc">A simple avatar made from the first letter of your name.</span>
            </span>
          </label>
          <label class="photo-option" data-option="upload">
            <input type="radio" name="photo-type" value="upload">
            <span class="opt-text">
              <span class="opt-title">Upload a photo</span>
              <span class="opt-desc">Upload a picture straight from your device.</span>
            </span>
          </label>
        </div>

        <div class="photo-field" id="field-upload">
          <input type="file" id="photo-file" accept="image/*">
          <img id="upload-preview" alt="Preview">
        </div>
      </div>

      <div>
        <label for="feedback">Your Review</label>
        <textarea id="feedback" placeholder="Tell me about your experience working together..." required></textarea>
      </div>

      <button type="submit" id="submit-btn">Submit Review →</button>
      <p id="status"></p>
    </form>
  </div>
</main>

<script>
  // Toggle the upload field based on selected option
  const photoOptions = document.querySelectorAll('.photo-option');
  const fieldUpload = document.getElementById('field-upload');

  photoOptions.forEach(opt => {
    opt.addEventListener('click', () => {
      photoOptions.forEach(o => o.classList.remove('selected'));
      opt.classList.add('selected');
      const type = opt.dataset.option;
      fieldUpload.classList.toggle('active', type === 'upload');
    });
  });

  // Live preview for uploaded file
  document.getElementById('photo-file').addEventListener('change', (e) => {
    const file = e.target.files[0];
    const preview = document.getElementById('upload-preview');
    if (file) {
      preview.src = URL.createObjectURL(file);
      preview.style.display = 'block';
    } else {
      preview.style.display = 'none';
    }
  });
</script>

<!-- Firebase SDKs -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, collection, addDoc, serverTimestamp }
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
  import { getStorage, ref, uploadBytes, getDownloadURL }
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

  const firebaseConfig = {
    // paste your real config here — same one already in index.html
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const storage = getStorage(app);

  const form = document.getElementById("feedback-form");
  const submitBtn = document.getElementById("submit-btn");
  const status = document.getElementById("status");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    submitBtn.disabled = true;
    submitBtn.textContent = "Submitting...";
    status.className = "";
    status.textContent = "";

    try {
      const token = await grecaptcha.execute("6LcG6Y4tAAAAAKR-pib-F8e3Jsjx5WaXcIyGfzbr", { action: "submit_review" });
      // TODO: Send token to your backend for verification (soft deterrent for now)

      const name = document.getElementById("name").value.trim();
      const feedback = document.getElementById("feedback").value.trim();
      const photoType = document.querySelector('input[name="photo-type"]:checked').value;

      let photoUrl = "";

      if (photoType === "upload") {
        const file = document.getElementById("photo-file").files[0];
        if (file) {
          submitBtn.textContent = "Uploading photo...";
          const fileRef = ref(storage, `reviews/${Date.now()}_${file.name}`);
          await uploadBytes(fileRef, file);
          photoUrl = await getDownloadURL(fileRef);
        }
      }
      // if photoType === "initials", photoUrl stays "" and index.html
      // falls back to rendering initials automatically.

      const docData = {
        name,
        feedback,
        approved: false,
        createdAt: serverTimestamp()
      };
      if (photoUrl) docData.photoUrl = photoUrl;

      await addDoc(collection(db, "reviews"), docData);

      window.location.href = "thank-you-feedback.html";
    } catch (err) {
      status.textContent = "Something went wrong. If you tried uploading a photo, try the initials option instead and let the site owner know.";
      status.className = "error";
      console.error(err);
      submitBtn.disabled = false;
      submitBtn.textContent = "Submit Review →";
    }
  });
</script>

</body>
</html>
